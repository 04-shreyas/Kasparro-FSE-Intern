[project]
name = "speaker-claim-agent"
version = "0.1.0"
description = "Claim extraction and catalogue-grounded classification assessment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

